<div class="list__item">
  <article class="archive__item" itemscope itemtype="https://schema.org/ScholarlyArticle">
    <h2 class="archive__item-title" itemprop="headline">{{ post.title | escape }}</h2>
    <p>
      <i>{{ post.venue }}</i>{% if post.year %}, {{ post.year }}{% endif %}
      {% if post.author_role %} &middot; {{ post.author_role }}{% endif %}
    </p>
    {% if post.excerpt %}
      <div class="archive__item-excerpt" itemprop="author">{{ post.excerpt | markdownify }}</div>
    {% endif %}
  </article>
</div>
