name: Build and publish personal homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-gh-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Install dependencies
        run: bundle install
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Verify generated profile, publications, and navigation
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = set()

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ('href', 'src') and value:
                          self.links.add(value)

          home = Path('_site/index.html').read_text()
          publications = Path('_site/publications/index.html').read_text()
          records = []
          for path in Path('_publications').glob('*.md'):
              match = re.search(r'^title:\s*"(.*)"\s*$', path.read_text(), re.MULTILINE)
              assert match, f'Missing publication title: {path}'
              records.append(json.loads('"' + match.group(1) + '"'))
          assert len(records) == 6, f'Expected six publications, got {len(records)}'
          for title in records:
              title_html = html.escape(title, quote=False)
              assert title_html in home, f'Publication missing from About: {title}'
              assert title_html in publications, f'Publication missing from Publications: {title}'

          for section in ['Research Interests', 'Education', 'Research Experience',
                          'Publications', 'Skills', 'Honors and Awards', 'Contact']:
              anchor = section.lower().replace(' ', '-')
              assert f'id="{anchor}"' in home, f'Missing section: {section}'
          for detail in ['Junteng Liu', 'HKUST NLP Group', 'Junxian He',
                         'Shanghai Jiao Tong University', 'Zifei Shan', 'Yu Cheng',
                         'MINIMAX', 'Tencent WXG', 'Shanghai AI Lab',
                         'Natural Language Processing', 'Machine Learning',
                         'Zhiyuan Honor Scholarship', 'jliugi@connect.ust.hk',
                         'Vicent0205', 'tbK9jl4AAAAJ', 'junteng88716710']:
              assert detail in home, f'Missing profile detail: {detail}'

          assert Path('_site/assets/css/main.css').is_file()
          for document in [home, publications]:
              parser = LinkParser()
              parser.feed(document)
              assert '/LJT-Homepage/assets/css/main.css' in parser.links, sorted(parser.links)
              assert '/LJT-Homepage/publications/' in parser.links, sorted(parser.links)
              for placeholder in ['Your Name', 'Your Sidebar Name', 'Paper Title Number', 'og-image.png']:
                  assert placeholder not in document, f'Template placeholder remains: {placeholder}'
              for route in ['cv', 'portfolio', 'teaching', 'talks', 'year-archive', 'markdown']:
                  assert f'/LJT-Homepage/{route}/' not in parser.links
          assert not list(Path('_site/publications').glob('*/index.html')), 'Unexpected publication detail pages'
          print('Verified all requested profile sections, six publications on both pages, contact links, and project-page asset paths.')
          print('Generated HTML pages:', sorted(str(path) for path in Path('_site').rglob('*.html')))
          PY
      - name: Publish static site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
